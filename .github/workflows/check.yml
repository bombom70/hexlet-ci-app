name: check
on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v7

      - name: Setup pnpm and Node
        uses: pnpm/setup@v1
        with:
          version: 11
          runtime: node@26
          cache: true
          install: false    # Отключить автоустановку, использовать make setup

      - run: make setup
      - run: make lint
      - run: make test
